<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Resume Screening & Smart Candidate Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <h2 class="navbar-brand text-uppercase fw-bold fs-4">
                        <span class="gradient-text">AI Resume Screening</span>
                    </h2>
                    <p class="text-secondary mt-1">Smart Candidate Management System</p>
                </div>

                <div class="glass-card p-4 p-sm-5">
                    <h3 class="text-center mb-4 fw-bold">Reset Password</h3>
                    <p class="text-center text-secondary mb-4 small">Enter your email and choose a new password.</p>

                    <!-- Global Error Alert -->
                    <div th:if="${globalError}" class="alert alert-custom-error mb-4" role="alert" th:text="${globalError}"></div>

                    <form th:action="@{/forgot-password}" th:object="${forgotPassword}" method="post">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" 
                                   th:errorclass="is-invalid" placeholder="Enter your registered email">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" 
                                   th:errorclass="is-invalid" placeholder="Min 6 characters">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" 
                                   th:errorclass="is-invalid" placeholder="Confirm new password">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-secondary mb-0">Remembered password? 
                            <a th:href="@{/login}" class="text-decoration-none text-accent-hover fw-bold" style="color: var(--accent);">Sign In</a>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
