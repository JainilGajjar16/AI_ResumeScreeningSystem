<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - AI Resume Screening & Smart Candidate Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg border-bottom" style="background: rgba(15, 23, 42, 0.45); border-color: rgba(255, 255, 255, 0.08) !important;">
        <div class="container">
            <a class="navbar-brand text-uppercase fw-bold" href="#">
                <span class="gradient-text">AI Resume Screening</span>
            </a>
        </div>
    </nav>

    <div class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card p-5">
                    <div class="stat-val text-danger mb-3">⚠️</div>
                    <h3 class="fw-bold mb-3">Something Went Wrong</h3>
                    <p class="text-secondary mb-4" th:text="${errorMessage}">An unexpected error occurred.</p>
                    <a th:href="@{/student/dashboard}" class="btn btn-primary">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
